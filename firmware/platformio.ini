; UMI Clip firmware. See README.md for the layout and what each environment is for.

[platformio]
default_envs = native

; Warnings are errors in our code: each lib/umi_* sets them in its
; library.json, and build_src_flags covers sil/ and the tests. Third-party
; libraries keep their own flags.
[strict]
flags =
    -Wall
    -Wextra
    -Wshadow
    -Wstrict-prototypes
    -Werror

; -std=c11 keeps umi_core honest on the host: it must build without GNU or
; ESP-IDF extensions. micro-ecc backs the host's software flag signer
; (umi_sim/soft_signer.c), which needs its arithmetic API; the Clip signs
; through mbedTLS/PSA instead.
[host]
platform = native
lib_deps = kmackay/micro-ecc @ ^1.0.0
build_flags =
    -std=c11
    -lm
    -DuECC_ENABLE_VLI_API=1
build_src_flags = ${strict.flags}
lib_compat_mode = off

; Unit tests of the core, codec, parsers and simulated drivers on the host.
; test_vectors reads the golden vectors where the reference codec keeps them,
; so a regenerated vector is checked against the C codec on the next run.
[env:native]
extends = host
test_framework = unity
build_flags =
    ${host.build_flags}
    -DUMI_HW_SIM=1
    -DUNITY_INCLUDE_DOUBLE
    -DUMI_VECTORS_DIR=\"$PROJECT_DIR/../protocol/vectors\"

; Software-in-the-loop: the real core with simulated drivers, as a host program
; (.pio/build/sil/program). src/ is target-only, so the host entry point lives
; in sil/ and is pulled in through the source filter.
[env:sil]
extends = host
build_src_filter = -<*> +<../sil/>
build_flags =
    ${host.build_flags}
    -DUMI_HW_SIM=1

; ESP32-S3-DevKitC-1 N16R8 (16 MB quad flash, 8 MB octal PSRAM). The board
; manifest describes the N8 variant, hence the overrides.
[target]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_flags = ${strict.flags}

; Bare devkit: simulated sensors from the scenario embedded in flash; real
; button GPIO, buzzer, LED, flash storage, signer and BLE.
[env:devkit]
extends = target
build_flags = -DUMI_HW_SIM=1
board_build.embed_txtfiles = test/scenarios/devkit-demo.scn
board_build.cmake_extra_args = -DUMI_SIM_SCENARIO=test/scenarios/devkit-demo.scn

; The Clip board with every real driver. Drivers that need the parts are
; skeletons until the order arrives (docs/hardware/assumptions.md).
[env:clip]
extends = target
lib_ignore = umi_sim
build_flags = -DUMI_HW_SIM=0
