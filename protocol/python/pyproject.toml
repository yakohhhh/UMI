[project]
name = "umi-protocol"
version = "0.1.0"
description = "UMI session log codec, privacy trim and flag signing (reference implementation)."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
]

[project.scripts]
umi-protocol = "umi_protocol.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umi_protocol"]

[dependency-groups]
dev = [
    "hypothesis>=6.112",
]
