[project]
name = "umi-sim"
version = "0.1.0"
description = "UMI Clip simulator: virtual riders that produce real session logs (fake hardware)."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "httpx>=0.28",
    "typer>=0.13",
    "tzdata>=2024.1",
    "umi-protocol",
]

[project.scripts]
umi-sim = "umi_sim.cli:app"

[tool.uv.sources]
umi-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/umi_sim"]
